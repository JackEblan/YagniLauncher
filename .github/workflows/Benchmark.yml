name: Benchmark

on:
  push:
    branches:
      - master
    paths:
      - 'domain/grid/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '.github/workflows/Benchmark.yml'
  pull_request:
    paths:
      - 'domain/grid/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '.github/workflows/Benchmark.yml'
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-benchmarks:
    name: "Run Benchmarks"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run benchmarks
        run: ./gradlew benchmark

      - name: Generate PR comment body
        if: ${{ success() && github.event_name == 'pull_request' }}
        run: |
          echo "## 📊 Benchmark Results" > benchmark-comment.md
          echo "" >> benchmark-comment.md
          echo "| Module | Benchmark | itemCount | Score | Error | Unit |" >> benchmark-comment.md
          echo "|---|---|---|---|---|---|" >> benchmark-comment.md
          for f in $(find . -path "*/build/reports/benchmarks/main/*" -name "benchmarks.json"); do
            module=$(echo "$f" | sed -E 's|^\./([^/]+(/[^/]+)*)/build/reports/benchmarks/.*|\1|')
            jq -r --arg module "$module" '.[] | "| \($module) | \(.benchmark | split(".") | last) | \(.params.itemCount) | \(.primaryMetric.score | (. * 1000 | round) / 1000) | ±\(.primaryMetric.scoreError | (. * 1000 | round) / 1000) | \(.primaryMetric.scoreUnit) |"' "$f" >> benchmark-comment.md
          done

      - name: Post PR comment
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmark-results
          path: benchmark-comment.md

      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: '**/build/reports/benchmarks/main/**/benchmarks.json'
          retention-days: 90